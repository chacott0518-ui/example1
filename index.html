<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STYLIST STUDIO</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
  theme: {
    extend: {
      colors: {
        'primary-bg': '#FFF0F3',
        'secondary-bg': '#FFE4E9',
        'card-bg': '#FFFFFF',
        'text-primary': '#4A3428',
        'text-secondary': '#8B7355',
        'text-accent': '#3D2817',
        'border-color': '#E4E4E7',
      },
            fontFamily: {
  serif: ['"Cormorant Garamond"', 'serif'],
  sans: ['Inter', 'sans-serif'],
},
            transitionTimingFunction: {
              'elegant': 'cubic-bezier(0.22, 1, 0.36, 1)',
            }
          }
        }
      }
    </script>

    <!-- Import Map -->
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
    "react-dom": "https://esm.sh/react-dom@18.3.1",
    "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
    "react/": "https://esm.sh/react@18.3.1/",
    "react-dom/": "https://esm.sh/react-dom@18.3.1/",
    "framer-motion": "https://esm.sh/framer-motion@11.11.17?external=react,react-dom",
    "lucide-react": "https://esm.sh/lucide-react@0.292.0?external=react,react-dom"
  }
}
</script>
</head>
<body class="bg-primary-bg text-text-primary overflow-x-hidden selection:bg-accent-wine selection:text-white">
    <div id="root"></div>
</body>
</html>
